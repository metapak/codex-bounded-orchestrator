      <circle cx="60" cy="62" r="31" fill="url(#gold)" stroke="#9b6137" stroke-width="3"/>
      <path d="M34 50q6-27 26-27 21 0 27 27-15-4-27-19-9 16-26 19Z" fill="#57352b"/>
