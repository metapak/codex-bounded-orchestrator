      <g id="baton-arm-static">
      <path d="M143 151q26 10 36 27" fill="none" stroke="#252024" stroke-width="16" stroke-linecap="round"/>
      <circle cx="181" cy="179" r="9" fill="url(#gold)"/>
      <path d="m182 178 31-66" stroke="#f9df9b" stroke-width="4" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="conductor-active" viewBox="0 0 220 300">
      <use xlink:href="#conductor-core" width="220" height="300"/>
      <g id="baton-arm-active">
      <path d="M143 151q26 10 36 27" fill="none" stroke="#252024" stroke-width="16" stroke-linecap="round"/>
      <circle cx="181" cy="179" r="9" fill="url(#gold)"/>
      <path d="m182 178 31-66" stroke="#f9df9b" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="-8 143 151;15 143 151;-8 143 151" keyTimes="0;.48;1" dur="2.6s" repeatCount="indefinite"/>
      </g>
      <g fill="#f7d58a" font-family="Georgia,serif" font-size="22" aria-hidden="true">
        <text x="165" y="77">♪<animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 -8;0 -18" dur="2.6s" repeatCount="indefinite"/></text>
        <text x="193" y="89" font-size="16">♫<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.25;.6;1" dur="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 2;0 -14" dur="2.6s" repeatCount="indefinite"/></text>
      </g>
    </symbol>
