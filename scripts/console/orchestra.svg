      <path d="M77 150q-27 11-30 46" fill="none" stroke="#252024" stroke-width="16" stroke-linecap="round"/>
      <circle cx="46" cy="197" r="9" fill="url(#gold)"/>
      <path d="M63 87q4-52 47-55 42 2 47 55l-6 33q-11 31-41 32-31-2-41-32Z" fill="url(#gold)" stroke="#8a5d32" stroke-width="3"/>
      <path d="M61 93q-11-5-10 13 1 15 17 15m90-28q10-5 10 13-1 15-17 15" fill="url(#gold)" stroke="#8a5d32" stroke-width="3"/>
      <path d="M68 77q4-48 42-49 39 1 43 49-17-17-28-34-16 26-57 34Z" fill="#3a2725"/>
      <path d="M83 95h16m22 0h16" stroke="#5d392d" stroke-width="4" stroke-linecap="round"/>
