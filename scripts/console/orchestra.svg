      <path d="M40 121q20-15 40 0l-4 18H44Z" fill="#c2813e" stroke="#f3cb82" stroke-width="2"/>
      <path d="M28 121q-8-17-2-25m60 25q8-17 2-25" fill="none" stroke="#edc16d" stroke-width="3" stroke-linecap="round"/>
      <path d="M35 129h50" stroke="#f7d68e" stroke-width="3"/><circle cx="60" cy="129" r="8" fill="#6c3c2d" stroke="#f7d68e" stroke-width="2"/>
