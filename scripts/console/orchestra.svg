<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Orchestra of helpers</title>
  <desc id="desc">An original golden conductor leads a small group of musicians on a burgundy stage.</desc>
  <defs>
    <linearGradient id="backdrop" x2="0" y2="1"><stop stop-color="#251a1c"/><stop offset="1" stop-color="#3b2925"/></linearGradient>
    <linearGradient id="curtain" x2="0" y2="1"><stop stop-color="#6b292c"/><stop offset="1" stop-color="#8e3d38"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe8a6"/><stop offset=".5" stop-color="#e9b75e"/><stop offset="1" stop-color="#b87935"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#725144"/><stop offset="1" stop-color="#382723"/></linearGradient>
    <radialGradient id="spot"><stop stop-color="#e8ba78" stop-opacity=".27"/><stop offset="1" stop-color="#e8ba78" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#130d0e" flood-opacity=".5"/></filter>
