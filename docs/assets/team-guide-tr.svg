  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="0" y="0" width="1600" height="760" rx="0" fill="#201619" stroke="#201619"/>
    <text x="65" y="72" font-size="19" fill="#E5BE7A" font-weight="700" letter-spacing="3">İŞİNİZE UYGUN BİR EKİP</text>
    <text x="65" y="133" font-size="46" fill="#FFF1D9" font-weight="700">Her uzmana belirli bir görev verin.</text>
    <rect x="65" y="185" width="470" height="490" rx="20" fill="#302124" stroke="#79503F"/>
    <text x="90" y="234" font-size="18" fill="#E5BE7A" font-weight="700">01</text>
    <text x="90" y="284" font-size="30" fill="#FFF1D9" font-weight="700">Görevleri seçin</text>
    <use xlink:href="#conductor" x="85" y="310" width="140" height="191"/>
    <use xlink:href="#musician-researcher" x="231" y="369" width="90" height="143"/>
    <use xlink:href="#musician-implementer" x="322" y="369" width="90" height="143"/>
    <use xlink:href="#musician-verifier" x="413" y="369" width="90" height="143"/>
    <text x="90" y="557" font-size="22" fill="#D7BDAB" font-weight="400">Şef koordinasyonu yürütür.</text>
    <text x="90" y="590" font-size="22" fill="#D7BDAB" font-weight="400">Uzmanlar verilen işleri yapar.</text>
    <text x="90" y="646" font-size="16" fill="#E5BE7A" font-weight="700">Araştır · Uygula · Doğrula · İncele</text>
    <rect x="565" y="185" width="470" height="490" rx="20" fill="#302124" stroke="#79503F"/>
    <text x="590" y="234" font-size="18" fill="#E5BE7A" font-weight="700">02</text>
    <text x="590" y="284" font-size="30" fill="#FFF1D9" font-weight="700">Modelleri seçin</text>
    <rect x="590" y="328" width="420" height="44" rx="10" fill="#442B2D" stroke="#79503F"/>
    <text x="608" y="357" font-size="20" fill="#FFF1D9" font-weight="700">Sol</text>
    <text x="960" y="357" font-size="22" fill="#E5BE7A" font-weight="400">›</text>
    <rect x="590" y="383" width="420" height="44" rx="10" fill="#442B2D" stroke="#79503F"/>
    <text x="608" y="412" font-size="20" fill="#FFF1D9" font-weight="700">Astra</text>
    <text x="960" y="412" font-size="22" fill="#E5BE7A" font-weight="400">›</text>
    <rect x="590" y="438" width="420" height="44" rx="10" fill="#442B2D" stroke="#79503F"/>
    <text x="608" y="467" font-size="20" fill="#FFF1D9" font-weight="700">Luna</text>
    <text x="960" y="467" font-size="22" fill="#E5BE7A" font-weight="400">›</text>
    <text x="590" y="557" font-size="22" fill="#D7BDAB" font-weight="400">Şef ve her yardımcı için</text>
    <text x="590" y="590" font-size="22" fill="#D7BDAB" font-weight="400">model ve inceleme düzeyini seçin.</text>
    <text x="590" y="646" font-size="16" fill="#E5BE7A" font-weight="700">Sol · Astra · Luna</text>
    <rect x="1065" y="185" width="470" height="490" rx="20" fill="#302124" stroke="#79503F"/>
    <text x="1090" y="234" font-size="18" fill="#E5BE7A" font-weight="700">03</text>
    <text x="1090" y="284" font-size="30" fill="#FFF1D9" font-weight="700">Geçmiş kullanımı okuyun</text>
    <text x="1090" y="339" font-size="16" fill="#D7BDAB" font-weight="400">Şef</text>
    <rect x="1090" y="350" width="420" height="14" rx="7" fill="#493233" stroke="#493233"/>
    <rect x="1090" y="350" width="280" height="14" rx="7" fill="#E5BE7A" stroke="#E5BE7A"/>
    <text x="1090" y="394" font-size="16" fill="#D7BDAB" font-weight="400">Araştırma</text>
    <rect x="1090" y="405" width="420" height="14" rx="7" fill="#493233" stroke="#493233"/>
    <rect x="1090" y="405" width="182" height="14" rx="7" fill="#B27168" stroke="#B27168"/>
    <text x="1090" y="449" font-size="16" fill="#D7BDAB" font-weight="400">Uygulama</text>
    <rect x="1090" y="460" width="420" height="14" rx="7" fill="#493233" stroke="#493233"/>
    <rect x="1090" y="460" width="226" height="14" rx="7" fill="#AC9074" stroke="#AC9074"/>
    <text x="1090" y="557" font-size="22" fill="#D7BDAB" font-weight="400">Kayıtlı ajan ve modelleri, token</text>
    <text x="1090" y="590" font-size="22" fill="#D7BDAB" font-weight="400">paylarını ve tarihli toplamları görün.</text>
    <text x="1090" y="646" font-size="16" fill="#E5BE7A" font-weight="700">Yerel kayıtlar · Örnek görünüm</text>
    <text x="65" y="720" font-size="18" fill="#AC8B75" font-weight="400">Resimli rehber · Ekip sayısı planlanan kapasitedir; kullanım geçmiş kayıtları gösterir.</text>
  </g>
