
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository contracts
        run: python scripts/validate.py

      - name: Install X Autopilot runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python entry points
        run: python -m py_compile .codex/tools/candidate.py scripts/install.py scripts/validate.py

      - name: Parse shell launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          sh -n setup.command

      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'setup.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Wrapper dry run
        shell: bash
        if: runner.os != 'Windows'
        run: |
          mkdir wrapper-target
          ./scripts/install.sh wrapper-target --profile astra --dry-run

      - name: Windows wrapper dry run
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path wrapper-target | Out-Null
          .\scripts\install.ps1 -Target (Resolve-Path wrapper-target) -Profile astra -DryRun

  postgres:
    name: PostgreSQL storage and migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xap_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: xap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XAP_TEST_DATABASE_URL: postgresql://xap_test:local-test-only@127.0.0.1:5432/xap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_x_autopilot_postgres.py' -v
      - run: python -m unittest discover -s tests -p 'test_x_autopilot_migration.py' -v
