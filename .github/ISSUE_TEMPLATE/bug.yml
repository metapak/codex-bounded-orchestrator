name: Bug report
description: Report a reproducible problem with the installer, tools, configuration, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities, use [private vulnerability reporting](https://github.com/metapak/codex-bounded-orchestrator/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or commit where you observed the problem.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Candidate tool
        - Agent configuration or routing
        - Release archive
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Codex client or surface, shell, and selected profile when relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence and exact commands. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include concise output or paths. Do not paste credentials, tokens, or private source.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets, credentials, or private data.
          required: true
